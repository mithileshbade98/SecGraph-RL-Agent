apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secgraph-rl-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secgraph-rl-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# Optional: KEDA ScaledObject for Event Hub backlog-based scaling
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: secgraph-rl-agent-keda
spec:
  scaleTargetRef:
    name: secgraph-rl-agent
  minReplicaCount: 2
  maxReplicaCount: 20
  triggers:
  - type: azure-eventhub
    metadata:
      connectionFromEnv: AZURE_EVENT_HUB_CONNECTION_STRING
      consumerGroup: $Default
      unprocessedEventThreshold: "100"
      blobContainer: checkpoint
