[tool.poetry]
name = "secgraph-rl-agent"
version = "0.1.0"
description = "Security-grade RL agent for multi-account abuse detection with graph reasoning"
authors = ["SecGraph Team"]
readme = "README.md"
packages = [{include = "reason_agent"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core ML/RL
torch = "^2.1.0"
numpy = "^1.24.0"
sentence-transformers = "^2.2.2"
faiss-cpu = "^1.7.4"
transformers = "^4.35.0"

# Graph & Database
neo4j = "^5.14.0"
torch-geometric = "^2.4.0"
networkx = "^3.2"

# RL Libraries
trl = "^0.7.4"
peft = "^0.7.0"

# Data & Processing
pandas = "^2.1.0"
pyarrow = "^14.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# API & UI
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
streamlit = "^1.28.0"
plotly = "^5.18.0"

# Observability
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.42b0"

# Utilities
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
click = "^8.1.7"
rich = "^13.7.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
ruff = "^0.1.6"
mypy = "^1.7.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=reason_agent --cov-report=term-missing"
